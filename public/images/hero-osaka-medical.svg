<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="1400" height="500">
  <defs>
    <!-- Main sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Building glow -->
    <linearGradient id="bldGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
    <!-- Cross glow -->
    <radialGradient id="crossGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft vignette overlay for text readability -->
    <linearGradient id="textOverlay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="1400" height="500" fill="url(#skyGrad)"/>

  <!-- Subtle grid dots (clinical feel) -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#1e40af"/>
    </pattern>
    <rect width="1400" height="500" fill="url(#dots)"/>
  </g>

  <!-- ═══ Dotonbori canal curve ═══ -->
  <path d="M0 420 Q200 380, 400 400 T800 390 T1200 405 T1400 395 L1400 500 L0 500Z"
        fill="url(#waterGrad)"/>
  <!-- Canal ripple lines -->
  <g stroke="#60a5fa" stroke-width="0.8" fill="none" opacity="0.3">
    <path d="M0 430 Q200 410, 450 425 T900 415 T1400 428"/>
    <path d="M0 445 Q250 430, 500 440 T950 432 T1400 442"/>
    <path d="M0 460 Q300 448, 550 455 T1000 448 T1400 458"/>
  </g>

  <!-- ═══ Abstract neon rectangles (Dotonbori signage) ═══ -->
  <g opacity="0.12">
    <!-- Far left cluster -->
    <rect x="80" y="220" width="28" height="140" rx="3" fill="#3b82f6"/>
    <rect x="115" y="250" width="22" height="110" rx="3" fill="#60a5fa"/>
    <rect x="145" y="235" width="18" height="125" rx="3" fill="#93c5fd"/>
    <!-- Left-center cluster -->
    <rect x="260" y="240" width="24" height="120" rx="3" fill="#2563eb"/>
    <rect x="290" y="260" width="20" height="100" rx="3" fill="#60a5fa"/>
    <rect x="318" y="248" width="16" height="112" rx="3" fill="#93c5fd"/>
    <!-- Right-center cluster -->
    <rect x="1040" y="235" width="22" height="125" rx="3" fill="#3b82f6"/>
    <rect x="1070" y="255" width="18" height="105" rx="3" fill="#60a5fa"/>
    <rect x="1095" y="242" width="24" height="118" rx="3" fill="#93c5fd"/>
    <!-- Far right cluster -->
    <rect x="1220" y="225" width="26" height="135" rx="3" fill="#2563eb"/>
    <rect x="1255" y="250" width="20" height="110" rx="3" fill="#60a5fa"/>
    <rect x="1282" y="238" width="18" height="122" rx="3" fill="#93c5fd"/>
  </g>

  <!-- ═══ Tsutenkaku silhouette (center) ═══ -->
  <g transform="translate(700, 60)" opacity="0.18">
    <!-- Base platform -->
    <rect x="-45" y="300" width="90" height="40" rx="2" fill="#1e40af"/>
    <!-- Lower body -->
    <path d="M-35 300 L-25 200 L25 200 L35 300Z" fill="#1e40af"/>
    <!-- Observation deck -->
    <rect x="-30" y="185" width="60" height="18" rx="3" fill="#1e40af"/>
    <!-- Upper narrowing body -->
    <path d="M-22 185 L-14 100 L14 100 L22 185Z" fill="#1e40af"/>
    <!-- Upper deck -->
    <rect x="-18" y="90" width="36" height="14" rx="2" fill="#1e40af"/>
    <!-- Spire -->
    <path d="M-8 90 L-4 30 L0 8 L4 30 L8 90Z" fill="#1e40af"/>
    <!-- Cross-beams (lattice detail) -->
    <line x1="-30" y1="220" x2="30" y2="270" stroke="#1e40af" stroke-width="2"/>
    <line x1="30" y1="220" x2="-30" y2="270" stroke="#1e40af" stroke-width="2"/>
    <line x1="-28" y1="250" x2="28" y2="295" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="28" y1="250" x2="-28" y2="295" stroke="#1e40af" stroke-width="1.5"/>
  </g>

  <!-- Building glow under Tsutenkaku -->
  <ellipse cx="700" cy="400" rx="200" ry="60" fill="url(#bldGlow)"/>

  <!-- ═══ Medical cross (top-right, subtle) ═══ -->
  <g transform="translate(1100, 80)" opacity="0.15">
    <circle cx="0" cy="0" r="60" fill="url(#crossGlow)"/>
    <rect x="-6" y="-24" width="12" height="48" rx="2" fill="#1e40af"/>
    <rect x="-24" y="-6" width="48" height="12" rx="2" fill="#1e40af"/>
  </g>

  <!-- ═══ ECG heartbeat wave (mid-lower, spanning width) ═══ -->
  <g transform="translate(0, 340)">
    <polyline
      points="0,0 100,0 180,0 220,-8 240,0 340,0
              380,-3 395,-18 410,24 425,-32 440,12 455,-6 470,0
              570,0 620,-5 640,0 740,0
              780,-3 795,-18 810,24 825,-32 840,12 855,-6 870,0
              970,0 1020,-5 1040,0 1140,0
              1180,-3 1195,-18 1210,24 1225,-32 1240,12 1255,-6 1270,0
              1370,0 1400,0"
      fill="none"
      stroke="#3b82f6"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.2"
    />
  </g>

  <!-- ═══ Smaller medical cross (top-left area) ═══ -->
  <g transform="translate(200, 100)" opacity="0.1">
    <rect x="-4" y="-16" width="8" height="32" rx="1.5" fill="#1e40af"/>
    <rect x="-16" y="-4" width="32" height="8" rx="1.5" fill="#1e40af"/>
  </g>

  <!-- ═══ Stethoscope abstract line (left area) ═══ -->
  <g transform="translate(380, 130)" opacity="0.1" fill="none" stroke="#1e40af" stroke-width="2" stroke-linecap="round">
    <path d="M0,0 Q-15,30 -5,55 Q5,80 0,100"/>
    <circle cx="0" cy="112" r="12" stroke-width="2"/>
    <circle cx="0" cy="112" r="4" fill="#1e40af" stroke="none"/>
  </g>

  <!-- ═══ Floating plus signs (clinical accents) ═══ -->
  <g opacity="0.08" fill="#1e40af">
    <text x="500" y="140" font-size="18" font-family="sans-serif" font-weight="300">+</text>
    <text x="900" y="170" font-size="14" font-family="sans-serif" font-weight="300">+</text>
    <text x="1200" y="200" font-size="16" font-family="sans-serif" font-weight="300">+</text>
    <text x="150" y="300" font-size="12" font-family="sans-serif" font-weight="300">+</text>
    <text x="1300" y="130" font-size="10" font-family="sans-serif" font-weight="300">+</text>
  </g>

  <!-- ═══ Text readability overlay (bottom gradient) ═══ -->
  <rect width="1400" height="500" fill="url(#textOverlay)"/>
</svg>
